body{overflow-x:clip}
a{color:inherit}

#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}

body.case .brand a{display:inline}body.case #cur{display:none}
.dots{position:fixed;right:clamp(14px,3vw,34px);top:50%;transform:translateY(-50%);z-index:20;display:grid;gap:14px}
body.case .dots{display:none}
.dots button{width:9px;height:9px;border-radius:50%;border:1px solid var(--mut);background:none;cursor:pointer;padding:0;transition:.4s}

main,#case{position:relative;z-index:10}

h1,h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:-.025em;line-height:.9}

.kind{font:12px var(--mono);color:var(--ac);margin-bottom:14px}
.txt h2{font-size:clamp(52px,6.6vw,104px);margin-bottom:16px}
.sum{font-size:clamp(15px,1.25vw,17px);line-height:1.55;color:var(--fg);opacity:.88}
.facts{list-style:none;margin:18px 0;display:grid;gap:9px;font-size:14px;color:var(--mut)}

.tech span{font:11.5px var(--mono);padding:5px 10px;border:1px solid var(--line);border-radius:99px}
.more{display:inline-flex;gap:10px;align-items:center;text-decoration:none;background:var(--ac);color:var(--bg);font-weight:600;font-size:15px;padding:13px 24px;border-radius:99px;transition:transform .3s,gap .3s}
.more:hover{transform:scale(1.05);gap:16px}

.hero .txt,.end .txt{background:none;border:0;backdrop-filter:none;width:auto;padding:0}

.hl{display:inline-block;overflow:hidden;padding:.04em 0;margin:0 .1em}

.end h2{font-size:clamp(60px,11vw,180px)}

.cta:hover{transform:scale(1.07) rotate(-2deg)}

.case-in{width:min(620px,100%);padding:15vh clamp(20px,5vw,60px) 22vh;animation:ci .9s .15s both cubic-bezier(.2,.8,.2,1)}
@keyframes ci{from{opacity:0;transform:translateY(40px)}}
.case-in h1{font-size:clamp(64px,8.4vw,128px);margin:10px 0 20px}
.lead{font-size:clamp(17px,1.5vw,20px);line-height:1.55}

.blk{margin-top:14vh}
.blk h3{font-size:clamp(34px,3.6vw,52px);margin-bottom:22px}
.feat{list-style:none;display:grid;gap:22px}

.feat b{display:block;font-weight:600;margin-bottom:6px}.feat span{color:var(--mut);font-size:15px;line-height:1.55}
.flow{list-style:none;position:relative;padding-left:34px;display:grid;gap:26px}
.flow::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1px;background:var(--line)}
.flow li{position:relative;opacity:.2;transition:opacity .7s,transform .7s;transform:translateX(-12px)}
.flow li::before{content:"";position:absolute;left:-34px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:1px solid var(--mut);transition:.5s}
.flow li.in{opacity:1;transform:none}.flow li.in::before{background:var(--ac);border-color:var(--ac);box-shadow:0 0 0 6px rgba(255,85,51,.18)}
.flow b{display:block;font-weight:600}.flow span{color:var(--mut);font-size:15px}

.next{display:block;margin-top:16vh;text-decoration:none}
.next small{display:block;font:12px var(--mono);color:var(--mut);margin-bottom:8px}
.next b{font:400 clamp(44px,6vw,88px)/.95 var(--serif);transition:color .3s}.next:hover b{color:var(--ac)}
@media(max-width:820px){.dots{display:none}.pin{align-items:flex-end;padding-bottom:50px}.txt{padding:18px 20px}.facts{display:none}.hero .pin{align-items:flex-start}.hl{display:block;margin:0}.case-in{padding-top:56vh}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.hl span,.hero .line{opacity:1;transform:none}.flow li{opacity:1;transform:none}}

 const ph=(t*.4+p*2)%3,a=Math.floor(ph),e=ease(clamp((ph-a-.3)/.5));const x=16+(a+e)*(cw+16)+8,y=64+220*.0+30*Math.sin(e*3.14);c.fillStyle="#ff5533";c.shadowColor="#000";c.shadowBlur=18;rr(c,x,y+110,cw-16,42,7);c.fill();c.shadowBlur=0;c.fillStyle="#0b0b0a";rr(c,x+8,y+121,cw*.45,7,3);c.fill()}};
/* ---- 3D devices ---- */
const metal=(c=0x2b2b29)=>new T.MeshStandardMaterial({color:c,metalness:.85,roughness:.3});
function Phone(draw){const w=1.1,h=2.3,d=.1,r=.22,s=new T.Shape();
 s.moveTo(-w/2+r,-h/2);s.lineTo(w/2-r,-h/2);s.quadraticCurveTo(w/2,-h/2,w/2,-h/2+r);s.lineTo(w/2,h/2-r);s.quadraticCurveTo(w/2,h/2,w/2-r,h/2);s.lineTo(-w/2+r,h/2);s.quadraticCurveTo(-w/2,h/2,-w/2,h/2-r);s.lineTo(-w/2,-h/2+r);s.quadraticCurveTo(-w/2,-h/2,-w/2+r,-h/2);
 const geo=new T.ExtrudeGeometry(s,{depth:d,bevelEnabled:true,bevelSize:.025,bevelThickness:.025,bevelSegments:5,curveSegments:16});geo.translate(0,0,-d/2);
 const g=new T.Group(),sc=mkScr(256,560,44,draw);g.add(new T.Mesh(geo,metal()));
 const scr=new T.Mesh(new T.PlaneGeometry(w-.09,h-.09),new T.MeshBasicMaterial({map:sc.tex,transparent:true,toneMapped:false}));scr.position.z=d/2+.028;g.add(scr);
 [[-.27,.88],[-.27,.6]].forEach(q=>{const l=new T.Mesh(new T.CylinderGeometry(.1,.1,.04,28),metal(0x0c0c0b));l.rotation.x=Math.PI/2;l.position.set(q[0],q[1],-d/2-.04);g.add(l)});
 return{g,sc:[sc]}}
function Laptop(draw){const g=new T.Group(),sc=mkScr(600,360,10,draw);
 const base=new T.Mesh(new T.BoxGeometry(2.9,.09,1.95),metal());g.add(base);
 const kc=document.createElement("canvas");kc.width=520;kc.height=240;const k=kc.getContext("2d");k.fillStyle="#1a1a18";k.fillRect(0,0,520,240);k.fillStyle="#2c2c2a";
 for(let r=0;r<5;r++)for(let q=0;q<14;q++){rr(k,8+q*36.5,8+r*30,32,26,4);k.fill()}k.fillStyle="#242422";rr(k,190,172,140,60,6);k.fill();
 const kt=new T.CanvasTexture(kc);kt.encoding=T.sRGBEncoding;const deck=new T.Mesh(new T.PlaneGeometry(2.6,1.2),new T.MeshStandardMaterial({map:kt,roughness:.6,metalness:.3}));deck.rotation.x=-Math.PI/2;deck.position.set(0,.047,.25);g.add(deck);
 const hinge=new T.Group();hinge.position.set(0,.045,-.97);g.add(hinge);
 const lg=new T.BoxGeometry(2.9,1.85,.07);lg.translate(0,.925,0);hinge.add(new T.Mesh(lg,metal()));
 const scr=new T.Mesh(new T.PlaneGeometry(2.7,1.62),new T.MeshBasicMaterial({map:sc.tex,transparent:true,toneMapped:false}));scr.position.set(0,.93,.037);hinge.add(scr);
 return{g,sc:[sc],open:v=>{hinge.rotation.x=Math.PI/2+(-.22-Math.PI/2)*ease(clamp(v))}}}
/* ---- scenes ---- */
const scenes=[];
const rigScene=(parts,o={})=>{const g=new T.Group(),inner=new T.Group();g.add(inner);const screens=[],laps=[];
 parts.forEach(([d,x,y,z,ry,sc])=>{d.g.position.set(x,y,z);d.g.rotation.y=ry;d.g.scale.setScalar(sc||1);inner.add(d.g);screens.push(...d.sc);if(d.open)laps.push(d)});
 scenes.push({g,screens,hero:o.hero,y0:o.y0||0,u:(lp,t,cs,dr)=>{const spin=cs?(lp*Math.PI*2):(lp-.5)*1.1;
  inner.rotation.y=(o.base||-.35)+spin+Math.sin(t*.5)*.06;inner.rotation.x=.06+my*.18;inner.rotation.z=mx*.04;inner.position.y=Math.sin(t*.9)*.07;
  laps.forEach(l=>l.open(cs?1:lp*4));if(dr)screens.forEach(s=>s.draw(lp,t))}})};
rigScene([[Laptop((c,w,h,p,t)=>D.dash(c,w,h,p,t)),-.4,-.5,0,0,1.05],[Phone((c,w,h,p,t)=>D.reel(c,w,h,p,t,0)),1.9,-.3,.9,-.35,.8]],{hero:1,y0:-.9,base:-.2});
rigScene([[Laptop((c,w,h,p,t)=>D.dash(c,w,h,p,t)),0,-.6,0,0,1.15]],{base:-.4});
rigScene([[Phone((c,w,h,p,t)=>D.reel(c,w,h,p,t,0)),-.75,0,.4,.15,1],[Phone((c,w,h,p,t)=>D.reel(c,w,h,p,t,2)),.95,-.15,-.6,-.2,1]],{base:-.3});
rigScene([[Phone((c,w,h,p,t)=>D.game(c,w,h,p,t,0)),-.95,0,0,.35,1],[Phone((c,w,h,p,t)=>D.game(c,w,h,p,t,1)),.95,0,0,-.35,1]],{base:0});
rigScene([[Laptop((c,w,h,p,t)=>D.web(c,w,h,p,t)),0,-.6,0,0,1.15]],{base:-.4});
rigScene([[Laptop((c,w,h,p,t)=>D.kan(c,w,h,p,t)),0,-.6,0,0,1.15]],{base:-.4});
rigScene([[Laptop((c,w,h,p,t)=>D.web(c,w,h,p,t)),-.4,-.5,0,0,1.05],[Phone((c,w,h,p,t)=>D.game(c,w,h,p,t,0)),1.9,-.3,.9,-.35,.8]],{hero:1,y0:-.5,base:-.2});
scenes.forEach((s,i)=>{s.g.position.y=-i*SP;scene.add(s.g)});
let W,H,desk,mx=0,my=0;
function size(){W=innerWidth;H=innerHeight;desk=W>820;ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(W,H,false);cam.aspect=W/H;cam.updateProjectionMatrix();
 scenes.forEach((s,i)=>{const c=i===0||i===scenes.length-1;s.g.position.x=desk&&!c?2.5:0;s.g.scale.setScalar(desk?1:(c?.7:.62));s.off=(c?s.y0:0)+(desk?0:(c?-.2:1.5))})}
addEventListener("resize",size);size();
addEventListener("pointermove",e=>{mx=e.clientX/W-.5;my=e.clientY/H-.5},{passive:true});
let cf=0,t=0,last=performance.now(),act=-1,zoom=0,zt=0,frame=0;
scrollCalc=function(){if(caseIdx>=0){caseP=clamp(scrollY/Math.max(1,document.documentElement.scrollHeight-H));$("#bar").style.transform=`scaleX(${caseP})`;return}
 $("#bar").style.transform=`scaleX(${clamp(scrollY/Math.max(1,document.documentElement.scrollHeight-H))})`;
 let idx=0;secs.forEach((el,i)=>{const r=el.getBoundingClientRect();if(r.top<=1)idx=i;
  const sp=clamp(-r.top/(r.height-H)),tx=el.querySelector(".txt"),o=clamp(1.9-Math.abs(sp-.5)*4.2);tx.style.opacity=o;tx.style.transform=`translateY(${(.5-sp)*60}px)`;tx.style.pointerEvents=o>.25?"auto":"none";
  if(i===idx)tf=clamp(i-.5+sp,0,S.length-1)});
 if(idx!==act){act=idx;$("#cur").textContent=S[idx].n;dots.forEach((d,j)=>d.classList.toggle("on",j===idx))}};
addEventListener("scroll",()=>scrollCalc(),{passive:true});
/* ---- routing ---- */
function renderCase(i){const p=P[i],nx=P[(i+1)%P.length];
 $("#case").innerHTML=`<article class="case-in"><p class="kind">${p.kind}</p><h1>${p.n}</h1><p class="lead">${p.sum}</p>
 <dl class="meta"><div><dt>My role</dt><dd>${p.role}</dd></div><div><dt>Where to see it</dt><dd>${p.access}</dd></div></dl>
 <section class="blk"><h3>What it does</h3><ul class="feat">${p.feats.map(f=>`<li><b>${f[0]}</b><span>${f[1]}</span></li>`).join("")}</ul></section>
 <section class="blk"><h3>How it fits together</h3><ol class="flow">${p.flow.map(f=>`<li><b>${f[0]}</b><span>${f[1]}</span></li>`).join("")}</ol></section>
 <section class="blk"><h3>Built with</h3><div class="stack">${p.stack.map(s=>`<span>${s}</span>`).join("")}</div></section>
 <a class="next" href="#/${nx.id}"><small>Next project</small><b>${nx.n} &rarr;</b></a></article>`;
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.6});
 document.querySelectorAll(".flow li").forEach(l=>io.observe(l))}
function route(){const m=location.hash.match(/^#\/(.+)/),i=m?P.findIndex(p=>p.id===m[1]):-1;
 if(i>=0){if(caseIdx<0)storyY=scrollY;caseIdx=i;document.body.classList.add("case");renderCase(i);scrollTo(0,0);zt=1;scrollCalc()}
 else if(caseIdx>=0){caseIdx=-1;document.body.classList.remove("case");zt=0;scrollTo(0,storyY);scrollCalc()}}
addEventListener("hashchange",route);addEventListener("keydown",e=>{if(e.key==="Escape"&&caseIdx>=0)location.hash="#/"});
route();scrollCalc();
(function loop(now){requestAnimationFrame(loop);const dt=reduce?0:Math.min(.05,(now-last)/1000);last=now;t+=dt;frame++;
 if(caseIdx>=0)tf=caseIdx+1;cf+=(tf-cf)*(reduce?1:.075);zoom+=(zt-zoom)*.06;
 cam.position.x+=(mx*1.2-cam.position.x)*.05;cam.position.y=-cf*SP-my*.6+.2;cam.position.z=9.5-zoom*2.3;cam.lookAt(0,-cf*SP,0);
 scenes.forEach((s,i)=>{const near=Math.abs(cf-i)<1.3;s.g.visible=near;if(near){s.g.position.y=-i*SP+s.off;
  const cs=caseIdx>=0&&i===caseIdx+1;s.u(cs?caseP:clamp(cf-i+.5),t,cs,frame%2===0);}});
 ren.render(scene,cam)})(last);
}
